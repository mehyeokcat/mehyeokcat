<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="240" rx="6" fill="#0a0e14"/>
  <rect x="1" y="1" width="798" height="238" rx="5" fill="none" stroke="#2a313c" stroke-width="2"/>
  <g stroke="#141a23" stroke-width="2">
    <line x1="560" y1="240" x2="800" y2="0"/>
    <line x1="620" y1="240" x2="860" y2="0"/>
    <line x1="680" y1="240" x2="920" y2="0"/>
  </g>

  <!-- meerkat -->
  <g transform="translate(24,2)">

  <!-- tail -->
  <path d="M84,198 C66,207 52,209 38,195" stroke="#a8844f" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M46,203 C42,201 40,198 38,195" stroke="#3b2f1f" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- body -->
  <path d="M90,68 C78,96 74,130 76,160 C77,185 80,198 84,206 L112,206 C118,190 122,165 120,140 C119,118 116,96 114,68 Z" fill="#c8a165"/>
  <!-- belly -->
  <path d="M110,74 C118,108 122,140 120,160 C119,182 116,196 112,206 L98,206 C104,185 108,165 106,140 C105,120 106,100 104,76 Z" fill="#e3c892"/>
  <!-- back stripes -->
  <g stroke="#8a6a3d" stroke-width="3" stroke-linecap="round">
    <line x1="77" y1="120" x2="87" y2="124"/>
    <line x1="75" y1="140" x2="86" y2="142"/>
    <line x1="76" y1="160" x2="87" y2="160"/>
  </g>

  <!-- arms folded -->
  <path d="M100,100 Q108,114 104,132" stroke="#967440" stroke-width="7" fill="none" stroke-linecap="round"/>
  <circle cx="104" cy="133" r="3.5" fill="#3b2f1f"/>
  <path d="M108,98 Q118,112 114,130" stroke="#a8844f" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="113" cy="131" r="4" fill="#3b2f1f"/>

  <!-- feet -->
  <ellipse cx="92" cy="208" rx="10" ry="4.5" fill="#3b2f1f"/>
  <ellipse cx="113" cy="208" rx="11" ry="4.5" fill="#3b2f1f"/>

  <!-- head (profile) -->
  <path d="M88,64 C86,44 98,32 112,34 C122,36 128,44 130,52 L142,66 C144,70 141,73 137,73 L120,78 C108,82 92,78 88,64 Z" fill="#c8a165"/>
  <!-- muzzle -->
  <path d="M126,54 L142,66 C144,70 141,73 137,73 L120,78 C114,70 116,60 126,54 Z" fill="#e3c892"/>
  <!-- ear -->
  <ellipse cx="97" cy="50" rx="4.5" ry="6.5" fill="#3b2f1f" transform="rotate(-10 97 50)"/>
  <!-- eye patch & alert eye -->
  <ellipse cx="113" cy="56" rx="9" ry="6" fill="#3b2f1f" transform="rotate(-25 113 56)"/>
  <circle cx="116" cy="55" r="3.2" fill="#b9822c"/>
  <circle cx="116" cy="55" r="1.7" fill="#0f0b07"/>
  <circle cx="117" cy="54" r="0.7" fill="#ffffff"/>
  <!-- nose & mouth -->
  <circle cx="141" cy="67" r="3" fill="#1c140d"/>
  <path d="M137,73 Q130,75 124,74" stroke="#1c140d" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</g>

  <!-- name -->
  <text x="208" y="148" font-family="'JetBrains Mono','Fira Code',Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="84" font-weight="800" fill="#c8a165">mehyeokcat</text>
</svg>
